name: Release

on:
  push:
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub mirror of the GHCR image: same index, same digest, same tags.
  DOCKERHUB_IMAGE: docker.io/vericto/vericto-proxy

# Read-only by default; each job below asks for exactly what it needs.
permissions:
  contents: read

jobs:
  # ── Build each arch on its native runner (no QEMU) ──────────────────────────
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The labels are set here because this is the step whose labels reach the image.
      # Without the explicit licenses label, metadata-action fills it from GitHub's
      # license detection, which does not recognise FSL-1.1-ALv2 (nor ELv2 before
      # it) and reports NOASSERTION.
      - name: Derive labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=vericto-proxy
            org.opencontainers.image.description=Vericto SQL security proxy — deterministic AST parsing
            org.opencontainers.image.licenses=FSL-1.1-ALv2

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # Separate cache scope per arch so they don't overwrite each other
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          # Output digest only — no tag yet (merged in next job)
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge both digests into a single multi-arch manifest ────────────────────
  merge:
    name: merge manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      # Keyless (Sigstore) signing of the build provenance attestation.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-amd64
          path: /tmp/digests

      - name: Download arm64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-arm64
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # Word splitting is intended: the first $(...) expands to "-t <tag>" pairs,
          # the second to one image reference per digest file.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Resolve the manifest digest
        id: digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in sha256:*) ;; *) echo "::error::no digest for $IMAGE"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Build provenance for the published multi-arch image: a Sigstore-signed
      # attestation tying the digest to this repository, workflow and commit,
      # stored in GHCR next to the image. Verify with
      # `gh attestation verify oci://ghcr.io/vericto/vericto-proxy:<version> --repo vericto/vericto-proxy`.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### Published vericto-proxy image"
            echo ""
            echo "Digest: \`$DIGEST\` (build provenance attested)"
            echo ""
            echo "Tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
            docker buildx imagetools inspect "$IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Copy the same multi-arch index to Docker Hub ────────────────────────────
  # A separate job so that only it can read the Docker Hub token: the
  # `dockerhub` environment holds DOCKERHUB_TOKEN (secret) and DOCKERHUB_USERNAME
  # (variable) and only accepts deployments from v*.*.* tags. GHCR is already
  # published when this job starts, so a Docker Hub problem never undoes it.
  # Without the token (environment not set up yet) every step after the check
  # is skipped with a notice and the job succeeds.
  dockerhub:
    name: mirror to Docker Hub
    runs-on: ubuntu-latest
    needs: merge
    environment:
      name: dockerhub
      url: https://hub.docker.com/r/vericto/vericto-proxy
    permissions:
      contents: read
      # Read the source index from GHCR (public, but authenticated pulls avoid rate limits).
      packages: read
      # Keyless (Sigstore) signing of the Docker Hub provenance attestation.
      id-token: write
      attestations: write

    steps:
      - name: Check Docker Hub credentials
        id: gate
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::notice title=Docker Hub skipped::DOCKERHUB_TOKEN is not set in the dockerhub environment; the image was published to GHCR only."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error title=Docker Hub misconfigured::DOCKERHUB_TOKEN is set but the DOCKERHUB_USERNAME variable is not (dockerhub environment)."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Copies the index GHCR serves, by digest, instead of building again, so
      # both registries serve byte-identical manifests. The tags are GHCR's with
      # the repository swapped (semver tags and latest).
      - name: Copy the multi-arch index to Docker Hub
        if: steps.gate.outputs.enabled == 'true'
        env:
          SOURCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.merge.outputs.digest }}
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          GHCR_TAGS: ${{ needs.merge.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in
              "$GHCR_IMAGE":*) args+=(-t "$DOCKERHUB_IMAGE:${tag#"$GHCR_IMAGE":}") ;;
              *) echo "::error::unexpected tag $tag"; exit 1 ;;
            esac
          done <<< "$GHCR_TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "::error::no tags to push"; exit 1; }
          docker buildx imagetools create "${args[@]}" "$SOURCE"

      - name: Check that both registries serve the same digest
        if: steps.gate.outputs.enabled == 'true'
        env:
          EXPECTED: ${{ needs.merge.outputs.digest }}
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}:${{ needs.merge.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$digest" != "$EXPECTED" ]; then
            echo "::error::$IMAGE is $digest, GHCR is $EXPECTED"
            exit 1
          fi

      # Same attestation as on GHCR, for the Docker Hub name of the same digest,
      # stored in Docker Hub next to the image. Verify with
      # `gh attestation verify oci://docker.io/vericto/vericto-proxy:<version> --repo vericto/vericto-proxy`.
      # actions/attest documents "docker.io" (not index.docker.io) as the
      # registry part for Docker Hub.
      - name: Attest build provenance
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ needs.merge.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: steps.gate.outputs.enabled == 'true'
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}:${{ needs.merge.outputs.version }}
        run: |
          {
            echo "### Mirrored to Docker Hub"
            echo ""
            echo "\`$IMAGE\`, digest \`$DIGEST\` (same as GHCR, build provenance attested)"
          } >> "$GITHUB_STEP_SUMMARY"
