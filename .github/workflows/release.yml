name: Release

on:
  push:
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub mirror of the GHCR image: same index, same digest, same tags.
  DOCKERHUB_IMAGE: docker.io/vericto/vericto-proxy

# Read-only by default; each job below asks for exactly what it needs.
permissions:
  contents: read

jobs:
  # ── Build each arch on its native runner (no QEMU) ──────────────────────────
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      # Keyless (Sigstore) signing of the SBOM attestation of this platform's image.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    # The databases the PGO profile is trained against (perf/pgo-train.sh), as
    # in perf-gate.yml. Both images are multi-arch indexes.
    services:
      postgres:
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: bench
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bench" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: bench
          MYSQL_DATABASE: bench
          MYSQL_USER: bench
          MYSQL_PASSWORD: bench
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pbench" --health-interval 2s --health-timeout 5s --health-retries 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── PGO profile (4.19.0, docs/PERFORMANCE.md "PGO") ──────────────────────
      # An instrumented build of this commit runs the performance gate's corpus
      # against the two databases above; the merged profile goes to the image
      # build as the `pgo` named context. Same rustc as the image (1.88.0), so the
      # profile matches. Code generation stays generic (no target-cpu).
      - name: Install Rust toolchain (PGO training)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.88.0"
          components: llvm-tools

      - name: Install system dependencies (libclang + protoc for pg_query)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev clang protobuf-compiler

      - name: Train the PGO profile
        run: |
          RUSTFLAGS="-Cprofile-generate=$RUNNER_TEMP/pgo-build" \
            cargo build --release --locked --bin vericto-proxy --example perf_gate
          export PERF_DRIVER=target/release/examples/perf_gate
          export LLVM_PROFILE_FILE="$RUNNER_TEMP/pgo-build/setup-%p.profraw"
          "$PERF_DRIVER" setup --dialect pg --url "host=127.0.0.1 port=5432 user=bench password=bench dbname=bench"
          "$PERF_DRIVER" setup --dialect mysql --url "mysql://bench:bench@127.0.0.1:3306/bench"
          perf/pgo-train.sh target/release/vericto-proxy "$RUNNER_TEMP/pgo/merged.profdata"
          rm -rf target "$RUNNER_TEMP/pgo-build"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The labels are set here because this is the step whose labels reach the image.
      # Without the explicit licenses label, metadata-action fills it from GitHub's
      # license detection, which does not recognise FSL-1.1-ALv2 (nor ELv2 before
      # it) and reports NOASSERTION. The official MCP Registry accepts an OCI package
      # only if the image carries io.modelcontextprotocol.server.name equal to the
      # server.json name (com.vericto/vericto-proxy, the `vericto-proxy mcp` server).
      - name: Derive labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=vericto-proxy
            org.opencontainers.image.description=Vericto: database guardrails for AI agents — deterministic AST parsing
            org.opencontainers.image.licenses=FSL-1.1-ALv2
            io.modelcontextprotocol.server.name=com.vericto/vericto-proxy

      # The gate runs before anything is pushed: the image is built once into a
      # local archive, scanned, and only then built again (every layer from the
      # builder's cache) and pushed by digest.
      - name: Build for the scan (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          tags: vericto-proxy:scan
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-contexts: pgo=${{ runner.temp }}/pgo
          cache-from: type=gha,scope=${{ matrix.platform }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar

      # Fails on a Critical or High finding that has a fix available; findings with
      # no fix yet are printed and do not block (see ci.yml, container-scan).
      - name: Scan with Grype (fail on fixable Critical/High)
        env:
          # anchore/grype v0.121.0, pinned by digest (multi-arch index).
          GRYPE_IMAGE: docker.io/anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" "$GRYPE_IMAGE" \
            docker-archive:/scan/image.tar --by-cve -o table
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" "$GRYPE_IMAGE" \
            docker-archive:/scan/image.tar --by-cve --only-fixed --fail-on high -o table

      - name: Generate the SBOM (SPDX JSON, Syft)
        env:
          # anchore/syft v1.55.0, pinned by digest (multi-arch index).
          SYFT_IMAGE: docker.io/anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" "$SYFT_IMAGE" \
            docker-archive:/scan/image.tar -o spdx-json > "$RUNNER_TEMP/sbom.spdx.json"
          jq -e '.spdxVersion and (.packages | length > 0)' "$RUNNER_TEMP/sbom.spdx.json" >/dev/null

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-contexts: pgo=${{ runner.temp }}/pgo
          # Separate cache scope per arch so they don't overwrite each other
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          # Output digest only — no tag yet (merged in next job)
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # Stored in GHCR next to the platform image and in GitHub's attestation store.
      # Its subject is the platform digest, not the multi-arch index: verify with
      # `gh attestation verify oci://ghcr.io/vericto/vericto-proxy@<platform digest>
      # --repo vericto/vericto-proxy --predicate-type https://spdx.dev/Document/v2.3`.
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/sbom.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge both digests into a single multi-arch manifest ────────────────────
  merge:
    name: merge manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      # Keyless (Sigstore) signing of the build provenance attestation.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-amd64
          path: /tmp/digests

      - name: Download arm64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-arm64
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # Word splitting is intended: the first $(...) expands to "-t <tag>" pairs,
          # the second to one image reference per digest file.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Resolve the manifest digest
        id: digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in sha256:*) ;; *) echo "::error::no digest for $IMAGE"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Build provenance for the published multi-arch image: a Sigstore-signed
      # attestation tying the digest to this repository, workflow and commit,
      # stored in GHCR next to the image. Verify with
      # `gh attestation verify oci://ghcr.io/vericto/vericto-proxy:<version> --repo vericto/vericto-proxy`.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### Published vericto-proxy image"
            echo ""
            echo "Digest: \`$DIGEST\` (build provenance attested)"
            echo ""
            echo "Tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
            docker buildx imagetools inspect "$IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Copy the same multi-arch index to Docker Hub ────────────────────────────
  # A separate job so that only it can read the Docker Hub token: the
  # `dockerhub` environment holds DOCKERHUB_TOKEN (secret) and DOCKERHUB_USERNAME
  # (variable) and only accepts deployments from v*.*.* tags. GHCR is already
  # published when this job starts, so a Docker Hub problem never undoes it.
  # Without the token (environment not set up yet) every step after the check
  # is skipped with a notice and the job succeeds.
  dockerhub:
    name: mirror to Docker Hub
    runs-on: ubuntu-latest
    needs: merge
    environment:
      name: dockerhub
      url: https://hub.docker.com/r/vericto/vericto-proxy
    permissions:
      contents: read
      # Read the source index from GHCR (public, but authenticated pulls avoid rate limits).
      packages: read
      # Keyless (Sigstore) signing of the Docker Hub provenance attestation.
      id-token: write
      attestations: write

    steps:
      - name: Check Docker Hub credentials
        id: gate
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::notice title=Docker Hub skipped::DOCKERHUB_TOKEN is not set in the dockerhub environment; the image was published to GHCR only."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error title=Docker Hub misconfigured::DOCKERHUB_TOKEN is set but the DOCKERHUB_USERNAME variable is not (dockerhub environment)."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Copies the index GHCR serves, by digest, instead of building again, so
      # both registries serve byte-identical manifests. The tags are GHCR's with
      # the repository swapped (semver tags and latest).
      - name: Copy the multi-arch index to Docker Hub
        if: steps.gate.outputs.enabled == 'true'
        env:
          SOURCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.merge.outputs.digest }}
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          GHCR_TAGS: ${{ needs.merge.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in
              "$GHCR_IMAGE":*) args+=(-t "$DOCKERHUB_IMAGE:${tag#"$GHCR_IMAGE":}") ;;
              *) echo "::error::unexpected tag $tag"; exit 1 ;;
            esac
          done <<< "$GHCR_TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "::error::no tags to push"; exit 1; }
          docker buildx imagetools create "${args[@]}" "$SOURCE"

      - name: Check that both registries serve the same digest
        if: steps.gate.outputs.enabled == 'true'
        env:
          EXPECTED: ${{ needs.merge.outputs.digest }}
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}:${{ needs.merge.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$digest" != "$EXPECTED" ]; then
            echo "::error::$IMAGE is $digest, GHCR is $EXPECTED"
            exit 1
          fi

      # Same attestation as on GHCR, for the Docker Hub name of the same digest,
      # stored in Docker Hub next to the image. Verify with
      # `gh attestation verify oci://docker.io/vericto/vericto-proxy:<version> --repo vericto/vericto-proxy`.
      # actions/attest documents "docker.io" (not index.docker.io) as the
      # registry part for Docker Hub.
      - name: Attest build provenance
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ needs.merge.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: steps.gate.outputs.enabled == 'true'
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}:${{ needs.merge.outputs.version }}
        run: |
          {
            echo "### Mirrored to Docker Hub"
            echo ""
            echo "\`$IMAGE\`, digest \`$DIGEST\` (same as GHCR, build provenance attested)"
          } >> "$GITHUB_STEP_SUMMARY"
