name: Performance gate

# Instructions per statement under callgrind, for the pull request's head and its
# base, on the corpus of examples/perf_gate.rs (both dialects; trivial, OLTP in
# every protocol, a large result, a policy-heavy mix with the control plane on).
# Fails when a workload grows by more than PERF_GATE_THRESHOLD_PCT, or when the
# head answers any statement of the corpus differently. Instruction counts are
# deterministic (the spread of repeated runs is under 0.3%), so a standard runner
# is enough and no EC2 host is involved. docs/PERFORMANCE.md has the design and
# how to run it locally.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Allowed growth of instructions per statement, per workload (docs/PERFORMANCE.md,
  # "Threshold"). A repository variable overrides it.
  PERF_GATE_THRESHOLD_PCT: ${{ vars.PERF_GATE_THRESHOLD_PCT || '3' }}

jobs:
  callgrind:
    name: instructions per statement (callgrind)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: bench
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bench" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: bench
          MYSQL_DATABASE: bench
          MYSQL_USER: bench
          MYSQL_PASSWORD: bench
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pbench" --health-interval 2s --health-timeout 5s --health-retries 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.88.0"

      - name: Install system dependencies (libclang + protoc for pg_query, valgrind)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang protobuf-compiler valgrind

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-perf-gate-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-perf-gate-v1-

      # The head's driver measures both builds, so the base needs no copy of it.
      - name: Build the head (proxy + driver)
        run: |
          cargo build --release --locked --bin vericto-proxy --example perf_gate
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/release/vericto-proxy "$RUNNER_TEMP/bin/head"
          cp target/release/examples/perf_gate "$RUNNER_TEMP/bin/perf_gate"

      # Same target directory: the dependencies the two share are not rebuilt.
      - name: Build the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            cargo build --release --locked --bin vericto-proxy --manifest-path "$RUNNER_TEMP/base/Cargo.toml"
          cp target/release/vericto-proxy "$RUNNER_TEMP/bin/base"

      - name: Create the corpus tables
        run: |
          "$RUNNER_TEMP/bin/perf_gate" setup --dialect pg \
            --url "host=127.0.0.1 port=5432 user=bench password=bench dbname=bench"
          "$RUNNER_TEMP/bin/perf_gate" setup --dialect mysql \
            --url "mysql://bench:bench@127.0.0.1:3306/bench"

      # callgrind_control reaches the proxy through vgdb, which needs ptrace on a
      # process that is not its child.
      - name: Allow vgdb to attach
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Measure base and head
        env:
          PERF_DRIVER: ${{ runner.temp }}/bin/perf_gate
        run: |
          perf/callgrind-gate.sh measure "$RUNNER_TEMP/bin/base" "$RUNNER_TEMP/base.jsonl"
          perf/callgrind-gate.sh measure "$RUNNER_TEMP/bin/head" "$RUNNER_TEMP/head.jsonl"

      # A pull request that changes what a statement is answered on purpose (a new
      # rule, a different message) carries the `perf-gate:outcome-change` label.
      - name: Compare
        env:
          PERF_GATE_ALLOW_OUTCOME_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'perf-gate:outcome-change') && '1' || '' }}
        run: perf/callgrind-gate.sh compare "$RUNNER_TEMP/base.jsonl" "$RUNNER_TEMP/head.jsonl"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-gate
          path: |
            ${{ runner.temp }}/base.jsonl
            ${{ runner.temp }}/head.jsonl
          if-no-files-found: ignore
          retention-days: 30
