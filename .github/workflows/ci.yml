name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # cargo resolves the private vericto-engine git dependency via the git CLI,
  # which honors the credential rewrite configured in the auth step below.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Authenticate to private vericto-engine repo
        run: |
          # Use the token as the PASSWORD with a fixed username. A bare
          # `https://<token>@github.com/` rewrite makes git treat the token as
          # the username and then demand a password, which aborts on a headless
          # runner ("could not read Password ... No such device or address").
          git config --global \
            url."https://x-access-token:${{ secrets.GH_PAT_PRIVATE_REPOS }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Install system dependencies (libclang + protoc for pg_query)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang libssl-dev pkg-config protobuf-compiler

      - name: Cache cargo registry and target
        uses: actions/cache@v4.2.3
        with:
          # `~/.cargo/git` is intentionally NOT cached: restoring a stale git
          # checkout of the private vericto-engine dep leaves cargo doing an
          # incremental fetch over a repo whose embedded config lacks the token,
          # so git prompts for a password and fails on the headless runner. The
          # git dep is re-fetched fresh each run (one small repo) with the auth
          # rewrite above. `-v2` retires the poisoned pre-existing caches.
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-v2-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all
