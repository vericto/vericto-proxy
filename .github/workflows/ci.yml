name: CI

on:
  push:
    branches: [main]
  # No `branches` filter: a stacked PR targets its parent branch rather than
  # main, and a base filter here would silently give it zero checks.
  pull_request:
  # Manual trigger. Without it there is no way to re-run CI on a branch without
  # pushing a commit — the hole we fell into when a GitHub Actions outage left
  # runs orphaned in `queued`, unable to be cancelled or re-run.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege for the GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# CI only checks out and builds, so it needs read access to the contents and nothing else.
permissions:
  contents: read

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Install system dependencies (libclang + protoc for pg_query)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang libssl-dev pkg-config protobuf-compiler

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # `~/.cargo/git` is not cached: the only git dependency is the public
          # vericto-engine repo, re-fetched each run (one small repo), so a stale
          # checkout is never restored into a build. `-v2` in the key retired
          # earlier caches that held such a checkout.
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-v2-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all

  # Dependency checks against the committed Cargo.lock: RustSec advisories
  # (vulnerable, unsound, unmaintained or yanked crates), licenses, bans and
  # sources, as configured in deny.toml.
  supply-chain:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.88.0"

      # Prebuilt binaries, checksum-verified by the action, so nothing is compiled.
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      - name: cargo deny
        run: cargo deny --locked check

      - name: cargo audit
        run: cargo audit --deny warnings

  # Builds the runtime image (linux/amd64; release.yml scans both platforms) and
  # scans it with Grype. Fails on a Critical or High finding that has a fix
  # available: such a finding means the base digest or a dependency must be bumped
  # before release. Findings with no fix yet are listed in the job log but do not
  # block, since nothing in this repository can resolve them.
  container-scan:
    name: container image scan (Grype)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Only main writes the cache, so pull requests (which can read main's cache)
      # do not fill the repository's cache quota.
      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          platforms: linux/amd64
          tags: vericto-proxy:ci-scan
          push: false
          provenance: false
          cache-from: type=gha,scope=ci-scan-amd64
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=ci-scan-amd64' || '' }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar

      - name: Scan with Grype (fail on fixable Critical/High)
        env:
          # anchore/grype v0.121.0, pinned by digest (multi-arch index).
          GRYPE_IMAGE: docker.io/anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" "$GRYPE_IMAGE" \
            docker-archive:/scan/image.tar --by-cve -o table
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" "$GRYPE_IMAGE" \
            docker-archive:/scan/image.tar --by-cve --only-fixed --fail-on high -o table

      # The image itself, not only the scanner: the container starts as non-root and
      # the shell-free health check answers.
      - name: Smoke-test the image
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          image=vericto-proxy:ci-scan
          user=$(docker image inspect "$image" --format '{{.Config.User}}')
          [ "$user" = "65532:65532" ] || { echo "::error::image user is '$user'"; exit 1; }
          docker run --rm --entrypoint /usr/local/bin/vericto-proxy "$image" healthcheck
          docker run -d --name proxy-smoke -e UPSTREAM_HOST=127.0.0.1 -e VERICTO_HEALTHZ_PORT=8081 "$image"
          ok=
          for _ in $(seq 1 20); do
            if docker exec proxy-smoke /usr/local/bin/vericto-proxy healthcheck; then ok=1; break; fi
            sleep 1
          done
          docker logs proxy-smoke
          docker rm -f proxy-smoke >/dev/null
          [ -n "$ok" ] || { echo "::error::vericto-proxy healthcheck never succeeded"; exit 1; }
