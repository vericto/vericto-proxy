# Keeps the SHA-pinned GitHub Actions in the workflows and the
# digest-pinned base images in the Dockerfile current, and proposes Cargo
# updates once a month in a single grouped PR.
#
# vericto-engine, pg_query and sqlparser are left out of the version updates:
# they move together and can change how SQL is parsed, so they are bumped by
# hand with their own CHANGELOG entry. Security fixes are not missed for them:
# Dependabot security updates are on in the repository settings, and the
# `supply-chain` CI job (cargo-deny + cargo-audit) fails every PR while a
# RustSec advisory applies to Cargo.lock.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: vericto-engine
      - dependency-name: pg_query
      - dependency-name: sqlparser
      # Major bumps change APIs; they are done by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]

  # Base image digests in the Dockerfile (and Dockerfile.local). The Rust image
  # stays on the toolchain line of rust-toolchain.toml: only its digest moves, not
  # 1.88. The runtime base is cgr.dev/chainguard/glibc-dynamic:latest pinned by
  # digest: `latest` is the only free tag, so there is no version to bump, only the
  # digest, and Chainguard rebuilds it often and does not promise to keep old
  # digests. Weekly keeps the pin close to what cgr.dev serves; the weekly image
  # scan (image-scan.yml) fails when the pin falls behind a fix.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(docker)
    ignore:
      - dependency-name: rust
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
