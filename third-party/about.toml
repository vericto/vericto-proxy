# cargo-about configuration for THIRD_PARTY_LICENSES, generated while building the
# Docker image (third-party/build-notices.sh). It covers what ships in the binary:
# build and dev dependencies are left out, and so are crates that only compile for
# targets the image is not built for (Windows, macOS, WASM).
#
# `accepted` is the list of licenses a dependency may use. A new dependency under
# any other license fails the image build instead of shipping without review.
accepted = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "Elastic-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
