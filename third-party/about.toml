# cargo-about configuration for THIRD_PARTY_LICENSES (third-party/build-notices.sh).
# The file is committed at the repository root and shipped in every release
# archive (dist-workspace.toml `include`); the Docker image build generates it
# again from this same configuration. CI fails when the committed file is not
# current. It covers what ships in the binaries: build and dev dependencies are
# left out, and so are crates that only compile for targets no release is built
# for (WASM, for example).
#
# `accepted` is the list of licenses a dependency may use. A new dependency under
# any other license fails the image build instead of shipping without review.
accepted = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

# The release targets of dist-workspace.toml (the image uses the two Linux ones).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Vericto's own crates use the same public license beginning with version 5.0.0.
# AGPL remains excluded for every third-party dependency.
[vericto-proxy]
accepted = ["AGPL-3.0-only"]

[vericto-engine]
accepted = ["AGPL-3.0-only"]
