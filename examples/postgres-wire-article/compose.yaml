name: ${COMPOSE_PROJECT_NAME}

services:
  pg17:
    image: ${POSTGRES17_IMAGE}
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pg17-data:/var/lib/postgresql/data
      - ${CERT_DIR}:/certs:ro
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - |
        cp /certs/shared.crt /var/lib/postgresql/server.crt
        cp /certs/shared.key /var/lib/postgresql/server.key
        chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
        chmod 0600 /var/lib/postgresql/server.key
        printf '101,from_file\n' >/tmp/vericto-copy.csv
        chown postgres:postgres /tmp/vericto-copy.csv
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 60

  pg18:
    image: ${POSTGRES18_IMAGE}
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pg18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 60

  proxy:
    image: ${PROXY_IMAGE}
    environment:
      UPSTREAM_HOST: pg17
      UPSTREAM_PORT: "5432"
      PROXY_LISTEN_PORT: "5433"
      VERICTO_HEALTHZ_PORT: "8080"
    depends_on:
      pg17:
        condition: service_healthy
    ports:
      - "127.0.0.1::5433"
    healthcheck:
      test: ["CMD", "/usr/local/bin/vericto-proxy", "healthcheck"]
      interval: 1s
      timeout: 3s
      retries: 60

  proxy-tls-distinct:
    image: ${PROXY_IMAGE}
    user: "${RUN_UID}:${RUN_GID}"
    environment:
      UPSTREAM_HOST: pg17
      UPSTREAM_PORT: "5432"
      UPSTREAM_SSLMODE: require
      PROXY_LISTEN_PORT: "5433"
      PROXY_TLS_MODE: require
      PROXY_TLS_CERT: /certs/distinct.crt
      PROXY_TLS_KEY: /certs/distinct.key
      VERICTO_HEALTHZ_PORT: "8080"
    volumes:
      - ${CERT_DIR}:/certs:ro
    depends_on:
      pg17:
        condition: service_healthy
    ports:
      - "127.0.0.1::5433"
    healthcheck:
      test: ["CMD", "/usr/local/bin/vericto-proxy", "healthcheck"]
      interval: 1s
      timeout: 3s
      retries: 60

  proxy-tls-shared:
    image: ${PROXY_IMAGE}
    user: "${RUN_UID}:${RUN_GID}"
    environment:
      UPSTREAM_HOST: pg17
      UPSTREAM_PORT: "5432"
      UPSTREAM_SSLMODE: require
      PROXY_LISTEN_PORT: "5433"
      PROXY_TLS_MODE: require
      PROXY_TLS_CERT: /certs/shared.crt
      PROXY_TLS_KEY: /certs/shared.key
      VERICTO_HEALTHZ_PORT: "8080"
    volumes:
      - ${CERT_DIR}:/certs:ro
    depends_on:
      pg17:
        condition: service_healthy
    ports:
      - "127.0.0.1::5433"
    healthcheck:
      test: ["CMD", "/usr/local/bin/vericto-proxy", "healthcheck"]
      interval: 1s
      timeout: 3s
      retries: 60

  proxy-refresh:
    image: ${PROXY_IMAGE}
    environment:
      UPSTREAM_HOST: pg17
      UPSTREAM_PORT: "5432"
      PROXY_LISTEN_PORT: "5433"
      VERICTO_HEALTHZ_PORT: "8080"
      VERICTO_API_URL: ${CONTROL_PLANE_URL}
      VERICTO_ALLOW_INSECURE_API_URL: "true"
      VERICTO_API_KEY: vtro_article_ephemeral
      VERICTO_DATABASE_ID: 00000000-0000-0000-0000-000000000001
      VERICTO_RULES_SYNC_INTERVAL_SECS: "30"
      VERICTO_POLICY_RULES: enforce
      VERICTO_BUNDLE_SIGNING_KEYS_FILE: /control/bundle-signing-keys.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CERT_DIR}/bundle-signing-keys.json:/control/bundle-signing-keys.json:ro
    depends_on:
      pg17:
        condition: service_healthy
    ports:
      - "127.0.0.1::5433"
    healthcheck:
      test: ["CMD", "/usr/local/bin/vericto-proxy", "healthcheck"]
      interval: 1s
      timeout: 3s
      retries: 60

  proxy18:
    image: ${PROXY_IMAGE}
    environment:
      UPSTREAM_HOST: pg18
      UPSTREAM_PORT: "5432"
      PROXY_LISTEN_PORT: "5433"
      VERICTO_HEALTHZ_PORT: "8080"
    depends_on:
      pg18:
        condition: service_healthy
    ports:
      - "127.0.0.1::5433"
    healthcheck:
      test: ["CMD", "/usr/local/bin/vericto-proxy", "healthcheck"]
      interval: 1s
      timeout: 3s
      retries: 60

volumes:
  pg17-data:
  pg18-data:
