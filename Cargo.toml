[package]
name = "vericto-proxy"
version = "4.7.0"
edition = "2024"
rust-version = "1.88"
description = "Vericto — Deterministic SQL firewall — TCP wire-protocol proxy for customer infrastructure"
license = "Elastic-2.0"
repository = "https://github.com/vericto/vericto-proxy"
readme = "README.md"

[[bin]]
name = "vericto-proxy"
path = "src/main.rs"

[dependencies]
# AST engine (open-core shared library)
vericto-engine = { git = "https://github.com/vericto/vericto-engine", tag = "v3.7.0" }

# PostgreSQL query normalization for sanitized telemetry (literals → $1, $2…).
# Same major version the engine uses, so libpg_query resolves to a single build.
# Both statically link libpg_query, so a major-version split here would compile
# and link two copies of it: bump this line and the engine tag above together.
pg_query = "6.2"

# MySQL tokenizer: the `?` count check on a masked COM_STMT_PREPARE
# (src/tcp/evaluator.rs) and sanitized telemetry of MySQL text (src/tcp/postgres.rs).
# The engine parses MySQL with this same crate, so it adds no code; keep the
# version the engine's: bump this line and the engine tag together.
sqlparser = "0.52"

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Object-safe async trait for the wire-protocol strategy (WireProtocol), so the
# active protocol (postgres | mysql | …) is selected at runtime behind a
# `dyn WireProtocol`. Required until native async-fn-in-trait is object-safe.
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Outbound HTTP client for telemetry reporting + rule sync to the Vericto API.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Upstream TLS client: encrypts the proxy→database hop (PostgreSQL SSLRequest +
# rustls handshake) when UPSTREAM_SSLMODE is require/verify-full.
tokio-rustls = "0.26"
webpki-roots = "0.26"
# PEM parsing comes from rustls-pki-types (re-exported by tokio-rustls as
# `rustls::pki_types::pem`), not from rustls-pemfile, which is unmaintained
# (RUSTSEC-2025-0134) and now only wraps that same parser.

# SHA-256 for the rules-cache link fingerprint (src/tcp/rules_cache.rs). Already
# compiled in as rustls's crypto provider, so this adds no new code.
ring = "0.17"

# Hot-swappable ruleset (rule syncer replaces it without locking the hot path).
arc-swap = "1.7"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
# Stands in for the control-plane API in the rules-sync tests (src/tcp/rules_sync.rs).
axum = "0.7"
# A real Postgres driver for the wire-level sensitive-column tests
# (src/tcp/sensitive_tests.rs), run against a live database when
# VERICTO_TEST_PG_URL is set. Dev-only: nothing of it ships in the binary.
tokio-postgres = "0.7"
# A real MySQL driver for the same tests, over COM_QUERY and prepared
# statements (COM_STMT_PREPARE / COM_STMT_EXECUTE), run when
# VERICTO_TEST_MYSQL_URL is set. rustls on ring (already in the tree) for the
# both-hops-TLS run; no C zlib.
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
