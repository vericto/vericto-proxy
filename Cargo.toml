[package]
name = "vetro-proxy"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "Vetro — Deterministic SQL firewall engine (AST parsing + rules) — pg_query + sqlparser-rs"
license = "Elastic-2.0"
repository = "https://github.com/vetrodev/vetro-proxy"
readme = "README.md"

[[bin]]
name = "vetro-proxy"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.38", features = ["full"] }

# HTTP server (AST evaluation endpoint consumed by the Fastify API)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "limit"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# SQL parsing — AST engine
# pg_query: binding oficial de libpg_query (el parser interno de PostgreSQL)
pg_query = "5.1"
# sqlparser-rs: parser multi-dialecto (MySQL, SQLite, Snowflake, ...)
sqlparser = "0.52"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Outbound HTTP client for telemetry reporting + rule sync to the Vetro API.
# rustls (no OpenSSL) keeps the static musl/alpine build simple.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Hot-swappable ruleset (rule syncer replaces it without locking the hot path).
arc-swap = "1.7"

# Utilities
uuid = { version = "1.10", features = ["v4"] }
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
