[package]
name = "vericto-proxy"
version = "4.0.1"
edition = "2024"
rust-version = "1.88"
description = "Vericto — Deterministic SQL firewall — TCP wire-protocol proxy for customer infrastructure"
license = "Elastic-2.0"
repository = "https://github.com/vericto/vericto-proxy"
readme = "README.md"

[[bin]]
name = "vericto-proxy"
path = "src/main.rs"

[dependencies]
# AST engine (open-core shared library)
vericto-engine = { git = "https://github.com/vericto/vericto-engine", tag = "v3.1.1" }

# PostgreSQL query normalization for sanitized telemetry (literals → $1, $2…).
# Same major version the engine uses, so libpg_query resolves to a single build.
pg_query = "5.1"

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Object-safe async trait for the wire-protocol strategy (WireProtocol), so the
# active protocol (postgres | mysql | …) is selected at runtime behind a
# `dyn WireProtocol`. Required until native async-fn-in-trait is object-safe.
async-trait = "0.1"

# HTTP server (AST evaluation endpoint consumed by the Fastify API)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "limit"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Outbound HTTP client for telemetry reporting + rule sync to the Vericto API.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Upstream TLS client: encrypts the proxy→database hop (PostgreSQL SSLRequest +
# rustls handshake) when UPSTREAM_PG_SSLMODE is require/verify-full.
tokio-rustls = "0.26"
webpki-roots = "0.26"
rustls-pemfile = "2"

# Hot-swappable ruleset (rule syncer replaces it without locking the hot path).
arc-swap = "1.7"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1.10", features = ["v4"] }
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
