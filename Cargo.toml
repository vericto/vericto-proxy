[package]
name = "vericto-proxy"
version = "4.22.0"
edition = "2024"
rust-version = "1.88"
description = "Vericto — Deterministic SQL firewall — TCP wire-protocol proxy for customer infrastructure"
license = "FSL-1.1-ALv2"
repository = "https://github.com/vericto/vericto-proxy"
readme = "README.md"

[[bin]]
name = "vericto-proxy"
path = "src/main.rs"

[dependencies]
# AST engine, Vericto's own source-available library, under FSL-1.1-ALv2 like
# the proxy from v4.3.0 on (earlier engine releases stay under the Elastic
# License 2.0).
vericto-engine = { git = "https://github.com/vericto/vericto-engine", tag = "v4.6.0" }

# PostgreSQL query normalization for sanitized telemetry (literals → $1, $2…).
# Same major version the engine uses, so libpg_query resolves to a single build.
# Both statically link libpg_query, so a major-version split here would compile
# and link two copies of it: bump this line and the engine tag above together.
pg_query = "6.2"

# MySQL tokenizer: the `?` count check on a masked COM_STMT_PREPARE
# (src/tcp/evaluator.rs) and sanitized telemetry of MySQL text (src/tcp/postgres.rs).
# The engine parses MySQL with this same crate, so it adds no code; keep the
# version the engine's: bump this line and the engine tag together.
sqlparser = "0.63"

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Object-safe async trait for the wire-protocol strategy (WireProtocol), so the
# active protocol (postgres | mysql | …) is selected at runtime behind a
# `dyn WireProtocol`. Required until native async-fn-in-trait is object-safe.
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Outbound HTTP client for telemetry reporting + rule sync to the Vericto API.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# gzip request bodies for /api/v1/ingest/events (telemetry reporter, 4.11.0).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Upstream TLS client: encrypts the proxy→database hop (PostgreSQL SSLRequest or
# MySQL SSL Request + rustls handshake) when UPSTREAM_SSLMODE is
# require/verify-ca/verify-full.
tokio-rustls = "0.26"
webpki-roots = "0.26"
# PEM parsing comes from rustls-pki-types (re-exported by tokio-rustls as
# `rustls::pki_types::pem`), not from rustls-pemfile, which is unmaintained
# (RUSTSEC-2025-0134) and now only wraps that same parser.

# SHA-256 for the rules-cache link fingerprint (src/tcp/rules_cache.rs). Already
# compiled in as rustls's crypto provider, so this adds no new code.
ring = "0.17"
# Base64 of the bundle-signing public keys and signatures (src/tcp/bundle_signature.rs).
# Already in the tree through reqwest, so it adds no new crate.
base64 = "0.22"

# Hot-swappable ruleset (rule syncer replaces it without locking the hot path).
arc-swap = "1.7"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# MCP Proxy mode (`vericto-proxy mcp`, 4.21.0): the proxy is the PostgreSQL
# client itself. Only the message encoders and the SCRAM-SHA-256 client of this
# crate are used (the low-level protocol crate, not tokio-postgres, which sends
# catalog lookups of its own that would bypass the evaluator: design
# "MCP execution modes" §5.3). Already in the tree through tokio-postgres (dev).
postgres-protocol = "0.6"
bytes = "1"
# The Streamable HTTP transport of `vericto-proxy mcp --transport http`: hyper's
# HTTP/1.1 server, already compiled in as reqwest's client (same crates, the
# server half enabled).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"

# Global allocator (4.19.0, the default `mimalloc` feature): fewer instructions
# per statement than glibc's malloc on every workload of the performance gate
# (docs/PERFORMANCE.md, "Allocator"). MIT, C sources compiled by `cc`, no system
# library. `--no-default-features` builds with the system allocator.
mimalloc = { version = "0.1", optional = true, default-features = false }

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
tempfile = "3"
# Stands in for the control-plane API in the rules-sync tests (src/tcp/rules_sync.rs).
axum = "0.7"
# A real Postgres driver for the wire-level sensitive-column tests
# (src/tcp/sensitive_tests.rs), run against a live database when
# VERICTO_TEST_PG_URL is set. Dev-only: nothing of it ships in the binary.
tokio-postgres = "0.7"
# A real MySQL driver for the same tests, over COM_QUERY and prepared
# statements (COM_STMT_PREPARE / COM_STMT_EXECUTE), run when
# VERICTO_TEST_MYSQL_URL is set. rustls on ring (already in the tree) for the
# both-hops-TLS run; no C zlib.
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
# Throwaway CAs and server/client certificates for the upstream TLS handshake
# tests (src/tcp/upstream.rs): a private CA, verify-ca against a certificate for
# another name, mutual TLS on the MySQL path. Generated per test run, so no
# private key is ever committed. ring only, already in the tree.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Property tests of the MCP exact-text guarantee (src/mcp/prop_tests.rs).
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
